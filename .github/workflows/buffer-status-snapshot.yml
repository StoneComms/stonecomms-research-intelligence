name: Buffer status snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-status-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Read recent StoneComms LinkedIn post status
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = 'https://api.buffer.com'
          const token = process.env.BUFFER_API_KEY
          if (!token) throw new Error('BUFFER_API_KEY is not configured')
          async function gql(query, variables = {}) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {'content-type': 'application/json', authorization: `Bearer ${token}`},
              body: JSON.stringify({query, variables}),
            })
            const payload = await response.json()
            if (!response.ok || payload.errors?.length) throw new Error(JSON.stringify(payload.errors || payload))
            return payload.data
          }
          const orgData = await gql(`query { account { organizations { id name } } }`)
          const candidates = []
          for (const organization of orgData.account.organizations) {
            const channelData = await gql(`query GetChannels($organizationId: OrganizationId!) {
              channels(input: {organizationId: $organizationId}) { id name displayName service }
            }`, {organizationId: organization.id})
            for (const channel of channelData.channels) {
              const label = `${channel.name || ''} ${channel.displayName || ''}`.toLowerCase()
              const service = String(channel.service || '').toLowerCase()
              if (service.includes('linkedin') && label.includes('stonecomms')) {
                candidates.push({organizationId: organization.id, channelId: channel.id, label})
              }
            }
          }
          if (candidates.length !== 1) throw new Error(`Expected one StoneComms LinkedIn channel; found ${candidates.length}`)
          const {organizationId, channelId} = candidates[0]
          const statuses = ['scheduled', 'sending', 'sent']
          let after = null
          const posts = []
          do {
            const data = await gql(`query GetPosts($input: PostsInput!, $first: Int, $after: String) {
              posts(input: $input, first: $first, after: $after) {
                edges { cursor node { id text dueAt sentAt status externalLink shareMode } }
                pageInfo { endCursor hasNextPage }
              }
            }`, {input: {organizationId, filter: {channelIds: [channelId], status: statuses}}, first: 100, after})
            posts.push(...data.posts.edges.map(e => e.node))
            after = data.posts.pageInfo.hasNextPage ? data.posts.pageInfo.endCursor : null
          } while (after)
          const since = Date.parse('2026-09-03T15:58:46.000Z')
          const until = Date.parse('2026-09-10T15:58:46.000Z')
          for (const post of posts) {
            const t = Date.parse(post.sentAt || post.dueAt || '')
            if (!Number.isFinite(t) || t < since - 86400000 || t > until + 8*86400000) continue
            console.log(JSON.stringify({id: post.id, status: post.status, dueAt: post.dueAt || null, sentAt: post.sentAt || null, externalLink: post.externalLink || null, text: String(post.text || '').slice(0,220)}))
          }
          NODE
