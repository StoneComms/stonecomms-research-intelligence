name: Publish social post via Buffer

on:
  push:
    branches: [main]
    paths:
      - 'social-outbox/*.json'
      - 'scripts/prepare-social-handoff.mjs'
      - 'scripts/social-safety.mjs'
      - 'scripts/publish-buffer-outbox.mjs'
      - '.github/workflows/buffer-publish.yml'
  schedule:
    - cron: '15 8 * * *'
  workflow_run:
    workflows: ['Publish Webflow Research Text']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-social-outbox
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify social safety checks
        run: node --test tests/*.test.mjs

      - name: Prepare missing company research promotions
        run: node scripts/prepare-social-handoff.mjs company

      - name: Publish new outbox requests
        run: node scripts/publish-buffer-outbox.mjs

      - name: Persist processed outbox state
        if: always()
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- social-outbox)" ]; then
            echo "No outbox state changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-outbox/*.json
          git commit -m "Mark Buffer outbox requests processed [skip ci]"
          # Replay the state commit onto current main without rerunning Buffer.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Outbox state push failed (attempt $attempt/5); fetching main again"
          done
          echo "::error::Could not persist processed Buffer outbox state after 5 attempts"
          exit 1

      - name: Save handoff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-social-handoff-${{ github.run_id }}
          path: social-company-handoff-result.json
          if-no-files-found: warn
          retention-days: 30
