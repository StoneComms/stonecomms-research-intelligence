name: Publish Lee personal LinkedIn roundup via Buffer

on:
  push:
    branches: [main]
    paths:
      - 'personal-social-outbox/*.json'
      - 'scripts/publish-buffer-personal-outbox.mjs'
      - 'scripts/prepare-social-handoff.mjs'
      - 'scripts/social-safety.mjs'
      - 'social-reconciliation/personal-coverage.json'
      - '.github/workflows/buffer-publish-personal.yml'
  schedule:
    - cron: '5 16 * * 4'
    - cron: '35 8 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-personal-social-outbox
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify social safety checks
        run: node --test tests/*.test.mjs

      # Weekly personal copy is authored by the editorial automation and placed in
      # personal-social-outbox; this job delivers it without generating boilerplate.

      - name: Publish Lee personal LinkedIn requests
        run: node scripts/publish-buffer-personal-outbox.mjs

      - name: Persist processed personal outbox state
        if: always()
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- personal-social-outbox)" ]; then
            echo "No personal outbox state changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-social-outbox/*.json
          git commit -m "Mark Lee personal Buffer request processed [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "::error::Could not persist personal outbox state"
          exit 1

      - name: Save handoff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-social-handoff-${{ github.run_id }}
          path: social-personal-handoff-result.json
          if-no-files-found: warn
          retention-days: 30
