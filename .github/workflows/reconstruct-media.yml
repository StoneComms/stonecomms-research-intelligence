name: Reconstruct media inbox

on:
  push:
    branches: [main]
    paths:
      - 'media-inbox/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconstruct-media-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and validate media
        run: node scripts/reconstruct-media-inbox.mjs

      - name: Commit reconstructed media
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- public/media)" ]]; then
            echo "No reconstructed media changes to commit."
            exit 0
          fi
          git config user.name "StoneComms Media Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add public/media
          git commit -m "Reconstruct media from inbox"
          git push origin HEAD:main
