name: Upload Webflow Assets

on:
  workflow_dispatch:
    inputs:
      publication_slug:
        description: Publication slug used for output metadata
        required: true
        type: string
      webflow_site_id:
        description: Optional Webflow site ID; falls back to manifest or repository variable WEBFLOW_SITE_ID
        required: false
        type: string
      asset_manifest_json:
        description: Optional JSON object with assets[]; overrides the convenience hero/PDF inputs below
        required: false
        type: string
      hero_url:
        description: Convenience input - public OneDrive/SharePoint view or direct URL for hero image
        required: false
        type: string
      hero_file_name:
        description: Hero filename including extension
        required: false
        default: hero.png
        type: string
      hero_content_type:
        description: Hero MIME type
        required: false
        default: image/png
        type: string
      hero_expected_bytes:
        description: Expected hero byte count
        required: false
        type: string
      hero_sha256:
        description: Expected hero SHA-256 hex digest
        required: false
        type: string
      pdf_url:
        description: Convenience input - public OneDrive/SharePoint view or direct URL for PDF
        required: false
        type: string
      pdf_file_name:
        description: PDF filename including extension
        required: false
        default: report.pdf
        type: string
      pdf_expected_bytes:
        description: Expected PDF byte count
        required: false
        type: string
      pdf_sha256:
        description: Expected PDF SHA-256 hex digest
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'webflow-asset-manifests/*.json'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      asset_references: ${{ steps.upload.outputs.asset_references }}
      asset_references_path: ${{ steps.upload.outputs.asset_references_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build asset manifest
        id: manifest
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PUBLICATION_SLUG: ${{ inputs.publication_slug }}
          INPUT_WEBFLOW_SITE_ID: ${{ inputs.webflow_site_id }}
          ASSET_MANIFEST_JSON: ${{ inputs.asset_manifest_json }}
          HERO_URL: ${{ inputs.hero_url }}
          HERO_FILE_NAME: ${{ inputs.hero_file_name }}
          HERO_CONTENT_TYPE: ${{ inputs.hero_content_type }}
          HERO_EXPECTED_BYTES: ${{ inputs.hero_expected_bytes }}
          HERO_SHA256: ${{ inputs.hero_sha256 }}
          PDF_URL: ${{ inputs.pdf_url }}
          PDF_FILE_NAME: ${{ inputs.pdf_file_name }}
          PDF_EXPECTED_BYTES: ${{ inputs.pdf_expected_bytes }}
          PDF_SHA256: ${{ inputs.pdf_sha256 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')

          function optionalInt(value) {
            if (!value) return undefined
            const n = Number(value)
            if (!Number.isInteger(n) || n < 1) throw new Error(`Invalid byte count: ${value}`)
            return n
          }

          let manifest
          if (process.env.EVENT_NAME === 'push') {
            const before = process.env.BEFORE_SHA
            const current = process.env.CURRENT_SHA
            const diffArgs = before && !/^0+$/.test(before)
              ? ['diff', '--name-only', before, current, '--', 'webflow-asset-manifests/*.json']
              : ['show', '--pretty=', '--name-only', current, '--', 'webflow-asset-manifests/*.json']
            const changed = execFileSync('git', diffArgs, { encoding: 'utf8' })
              .split(/\r?\n/).map(s => s.trim()).filter(Boolean)
            if (changed.length !== 1) throw new Error(`Expected exactly one changed Webflow asset manifest, found ${changed.length}`)
            manifest = JSON.parse(fs.readFileSync(changed[0], 'utf8'))
          } else if (process.env.ASSET_MANIFEST_JSON?.trim()) {
            manifest = JSON.parse(process.env.ASSET_MANIFEST_JSON)
            if (!manifest.publicationSlug) manifest.publicationSlug = process.env.PUBLICATION_SLUG
            if (!manifest.webflowSiteId && process.env.INPUT_WEBFLOW_SITE_ID) manifest.webflowSiteId = process.env.INPUT_WEBFLOW_SITE_ID
          } else {
            const assets = []
            if (process.env.HERO_URL) {
              assets.push({ key: 'hero', sourceUrl: process.env.HERO_URL, fileName: process.env.HERO_FILE_NAME || 'hero.png', contentType: process.env.HERO_CONTENT_TYPE || 'image/png', expectedBytes: optionalInt(process.env.HERO_EXPECTED_BYTES), sha256: process.env.HERO_SHA256 || undefined })
            }
            if (process.env.PDF_URL) {
              assets.push({ key: 'pdf', sourceUrl: process.env.PDF_URL, fileName: process.env.PDF_FILE_NAME || 'report.pdf', contentType: 'application/pdf', expectedBytes: optionalInt(process.env.PDF_EXPECTED_BYTES), sha256: process.env.PDF_SHA256 || undefined })
            }
            if (!assets.length) throw new Error('Provide asset_manifest_json or at least one of hero_url/pdf_url')
            manifest = { publicationSlug: process.env.PUBLICATION_SLUG, webflowSiteId: process.env.INPUT_WEBFLOW_SITE_ID || undefined, assets }
          }

          if (!Array.isArray(manifest.assets) || !manifest.assets.length) throw new Error('Manifest requires a non-empty assets[] array')
          fs.writeFileSync('webflow-asset-manifest.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          cat webflow-asset-manifest.json

      - name: Resolve Webflow site ID
        id: site
        shell: bash
        env:
          INPUT_SITE_ID: ${{ inputs.webflow_site_id }}
          REPO_SITE_ID: ${{ vars.WEBFLOW_SITE_ID }}
        run: |
          SITE_ID="${INPUT_SITE_ID:-${REPO_SITE_ID:-}}"
          if [ -z "$SITE_ID" ]; then SITE_ID="$(node -p "require('./webflow-asset-manifest.json').webflowSiteId || ''")"; fi
          if [ -z "$SITE_ID" ]; then echo 'No Webflow site ID supplied' >&2; exit 1; fi
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload and verify Webflow assets
        id: upload
        env:
          WEBFLOW_SITE_ID: ${{ steps.site.outputs.site_id }}
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_KEY }}
          ASSET_MANIFEST_PATH: webflow-asset-manifest.json
          WEBFLOW_ASSET_OUTPUT_PATH: webflow-asset-references.json
        run: node scripts/upload-webflow-assets.mjs

      - name: Show Webflow asset references
        run: cat webflow-asset-references.json

      - name: Upload reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: webflow-assets-${{ github.run_id }}
          path: webflow-asset-references.json
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        shell: bash
        run: |
          {
            echo '## Webflow asset upload complete'
            echo
            echo '```json'
            cat webflow-asset-references.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
